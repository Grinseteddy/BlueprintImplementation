# The one build command on every push and pull request (ADR0018, QS-16: under 10 minutes).
name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build, format and Error Prone checks, fast and slow suites (Testcontainers), Spectral lint of both specs (ADR0018)
        run: ./mvnw -B verify
      - name: Intent coverage of the increment (gaps fail the build)
        run: |
          pip install --quiet pyyaml==6.0.2
          python3 tools/coverage/intent_coverage.py docs/cooking-assistance/coverage/inventory-inc2.yaml . | tee intent-coverage.md
      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports
          path: |
            */target/surefire-reports/
            */target/failsafe-reports/
            larder-app/target/cucumber/
