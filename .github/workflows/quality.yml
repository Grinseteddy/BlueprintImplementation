# Fault-injection quality scenarios (step 12, increment 1): QS-04 broker outage and QS-05 database
# outage, on Testcontainers. Long-running, so never in `verify`: on demand and once a week.
name: quality

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

jobs:
  fault-injection:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: QS-04 and QS-05 (the fault-injection group only, indicative on test containers)
        run: >-
          ./mvnw -B verify -pl larder-app -am -Dtest=none -Dsurefire.failIfNoSpecifiedTests=false
          -Dfailsafe.failIfNoSpecifiedTests=false -Dgroups=fault-injection -Dfault-injection.excluded=
          -Dit.test='!AcceptanceIT'
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-reports
          path: larder-app/target/failsafe-reports/
