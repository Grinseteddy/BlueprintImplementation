# the identity provider's JWKS endpoint; never fetched in tests (they verify with TestSigningKeys)
cooking-assistance.security.jwk-set-uri=http://localhost:0/jwks-never-fetched
cooking-assistance.public-base-url=http://localhost
# the test broker (Testcontainers' service connection sets host, port and credentials); no TLS
LARDER_BROKER_HOST=localhost
LARDER_BROKER_USERNAME=guest
LARDER_BROKER_PASSWORD=guest
LARDER_BROKER_SSL=false
# the test database (Testcontainers' service connection sets URL and credentials)
LARDER_DB_URL=jdbc:postgresql://localhost/set-by-testcontainers
LARDER_DB_USERNAME=set-by-testcontainers
LARDER_DB_PASSWORD=set-by-testcontainers
