# Cook Assistance owns schema cooking_assistance (ADR0002, ADR0009)
spring.flyway.schemas=cooking_assistance
spring.flyway.default-schema=cooking_assistance
spring.flyway.locations=classpath:db/cooking-assistance/migration
# the module works in its own schema: unqualified table names resolve to cooking_assistance
spring.datasource.hikari.schema=cooking_assistance
# the identity provider's JWKS endpoint; never fetched in tests (they verify with TestSigningKeys)
cooking-assistance.security.jwk-set-uri=http://localhost:0/jwks-never-fetched
# the outbox poller runs only where a test asks for it (it would compete with the relay tests)
cooking-assistance.outbox.poller.enabled=false
# links in responses start with the public base URL, never with the request's Host (security review SEC-10)
cooking-assistance.public-base-url=http://localhost
